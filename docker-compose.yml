services:
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: taxi-demand-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/app
      - ${TAXI_RAW_DIR:-../taxi-demand-data/raw}:/data/raw:ro

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.1
    container_name: taxi-demand-spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - ${TAXI_RAW_DIR:-../taxi-demand-data/raw}:/data/raw:ro

  spark-worker-2:
    image: bitnamilegacy/spark:3.5.1
    container_name: taxi-demand-spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8081"
    volumes:
      - .:/app
      - ${TAXI_RAW_DIR:-../taxi-demand-data/raw}:/data/raw:ro
